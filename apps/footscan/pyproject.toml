[project]
name = "footscan"
version = "0.0.1"
description = "Phone scan to 3D-printed foot orthotic research pipeline. Not a medical device."
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "trimesh"]

[project.optional-dependencies]
# Phase 2 reconstruction: COLMAP (structure from motion), MeshLab (surface
# operations), Manifold (exact CSG for the calibration object), OpenCV.
recon = ["opencv-python-headless", "pycolmap", "pymeshlab", "manifold3d", "rtree", "shapely"]
dev = ["pytest", "opencv-python-headless", "pymupdf", "embreex"]  # embreex: ray casting for synthetic test scenes

[project.scripts]
footscan = "footscan.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["slow: end-to-end reconstruction of a rendered scene (minutes); run with -m slow"]
addopts = "-m 'not slow'"
