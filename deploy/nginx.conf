# nginx config for the static site — use this if nginx is already on the box.
# Otherwise prefer deploy/Caddyfile, which handles HTTPS without certbot.
#
# Place at: /etc/nginx/sites-available/brandongreene
# Enable:   sudo ln -s /etc/nginx/sites-available/brandongreene /etc/nginx/sites-enabled/
# Test:     sudo nginx -t
# Reload:   sudo systemctl reload nginx
#
# For HTTPS: sudo certbot --nginx -d brandongreene.dev -d www.brandongreene.dev
# Certbot rewrites this file to add the TLS block and sets up auto-renewal.
#
# CHANGE THE DOMAIN in server_name below.

server {
	listen 80;
	listen [::]:80;
	server_name brandongreene.dev www.brandongreene.dev;

	root /var/www/brandongreene;
	index index.html;

	# Clean URLs matching Astro's directory-per-page build.
	location / {
		try_files $uri $uri/index.html $uri.html $uri/ =404;
	}

	error_page 404 /404.html;
	location = /404.html {
		internal;
	}

	# Fingerprinted assets and self-hosted fonts never change content.
	location ~* ^/(_astro|fonts)/ {
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		access_log off;
	}

	# HTML revalidates so a deploy shows up immediately.
	location ~* \.html$ {
		add_header Cache-Control "public, max-age=0, must-revalidate" always;
	}

	add_header X-Content-Type-Options "nosniff" always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header X-Frame-Options "DENY" always;
	add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
	add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
	server_tokens off;

	gzip on;
	gzip_vary on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
	# woff2 and the generated PNGs are already compressed — do not re-compress.

	client_max_body_size 1m;
}
