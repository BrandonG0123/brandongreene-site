<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D model — footscan</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .steps { display: flex; gap: 6px; flex-wrap: wrap; margin: 14px 0 6px; padding: 0; list-style: none; }
    .steps li { font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); color: var(--muted); }
    .steps li.done { background: var(--ok-soft); color: var(--ok); }
    .steps li.now { background: var(--brand); color: #fff; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.65; } }
    @media (prefers-reduced-motion: reduce) { .steps li.now { animation: none; } }
    .big { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 14px 0 0; }
    .big div { background: var(--surface-2); border-radius: 12px; padding: 12px 14px; }
    .big dt { color: var(--muted); font-size: 0.78rem; }
    .big dd { margin: 4px 0 0; font: 700 1.35rem/1.1 var(--mono); font-variant-numeric: tabular-nums; }
    .big dd small { font: 400 0.75rem/1.35 var(--font); color: var(--muted); display: block; margin-top: 4px; }
    table.dims { width: 100%; border-collapse: collapse; font-size: 0.9rem; margin-top: 10px; }
    table.dims th, table.dims td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
    table.dims th:first-child, table.dims td:first-child { text-align: left; }
    table.dims td { font-family: var(--mono); }
    table.dims td:first-child { font-family: inherit; }
    .table-scroll { overflow-x: auto; }
    .calipers { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
    .profile svg { width: 100%; height: auto; display: block; }
    .files { display: flex; gap: 8px; flex-wrap: wrap; }
    section.card { margin: 0 0 16px; }
    pre.log { white-space: pre-wrap; font-size: 0.78rem; max-height: 240px; overflow: auto; background: var(--surface-2); padding: 10px; border-radius: 10px; }
  </style>
</head>
<body data-area="studio">
<main class="wrap" style="max-width:980px">
  <p class="eyebrow" id="eyebrow">Phase 2 · 3D model</p>
  <h1 style="font-size:clamp(1.7rem,4vw,2.4rem);margin:0 0 6px" id="title">3D model</h1>
  <p class="muted" style="margin:0 0 18px" id="back"></p>
  <div id="root" aria-live="polite"><p class="muted">Loading…</p></div>
</main>
<script type="module" src="/assets/layout.js"></script>
<script type="module" src="/assets/model-page.js"></script>
</body>
</html>
