<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Submission — footscan studio</title>
  <link rel="stylesheet" href="/assets/style.css">
  <style>
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
    .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px 18px; margin: 0; }
    .facts dt { font-size: 0.75rem; color: var(--muted); }
    .facts dd { margin: 0; font-weight: 600; }
    .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; margin-top: 12px; }
    .thumbs a { display: block; aspect-ratio: 4 / 3; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
    .thumbs img { width: 100%; height: 100%; object-fit: cover; }
    .pipeline { list-style: none; padding: 0; margin: 0; display: grid; }
    .pipeline li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
    .pipeline li:first-child { border-top: 0; padding-top: 0; }
    .pipeline .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-size: 0.75rem; font-weight: 800; }
    .pipeline .done .dot { background: var(--ok); border-color: var(--ok); color: #fff; }
    .pipeline .blocked .dot { border-style: dashed; }
    .pipeline p { margin: 2px 0 0; font-size: 0.87rem; color: var(--muted); }
    .history { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; font-size: 0.9rem; }
    aside > section { margin: 0; }
    .answers { display: grid; gap: 8px; margin: 0; }
    .answers div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .answers dt { color: var(--muted); font-size: 0.9rem; }
    .answers dd { margin: 0; font-weight: 600; font-size: 0.93rem; }
    @media (max-width: 560px) { .answers div { grid-template-columns: 1fr; gap: 2px; } }
    .history time { color: var(--muted); font-size: 0.8rem; display: block; }
  </style>
</head>
<body data-area="studio">
<main class="wrap">
  <a href="/studio/" style="display:inline-block;margin-bottom:12px">← All submissions</a>
  <div id="root"><p class="muted">Loading…</p></div>
</main>
<script type="module" src="/assets/layout.js"></script>
<script type="module">
  import { STATUS, esc, fmtDate } from "/assets/studio.js";
  const id = new URLSearchParams(location.search).get("id");
  let schema = null;
  const root = document.getElementById("root");
  const ACK_TEXT = {
    not_medical_device: "Understands it is not a medical device",
    clinician_review: "Will have a clinician check it before sport",
    break_in: "Will follow the break-in guide and stop on new pain",
    photo_consent: "Agreed to foot photos being stored",
  };

  async function load() {
    const r = await fetch(`/api/submissions/${encodeURIComponent(id)}`);
    if (!r.ok) { root.innerHTML = `<div class="callout stop"><p>Submission not found.</p></div>`; return; }
    schema = (await (await fetch("/api/survey")).json()).sections;
    render(await r.json());
  }

  function answerText(q, a) {
    if (a === undefined || a === null || a === "") return "—";
    const label = (v) => (q.options || []).find(([k]) => k === v)?.[1] ?? v;
    if (Array.isArray(a)) return a.map(label).join(", ");
    if (q.type === "confirm") return a ? "Confirmed" : "—";
    return label(a);
  }

  function surveyCard(s) {
    if (!s.survey) return "";
    return `<section class="card" style="margin:0 0 16px"><h2 style="margin:0 0 10px;font-size:1.3rem">Survey</h2>
      ${schema.map((sec) => {
        const rows = sec.questions.filter((q) => q.id in s.survey)
          .map((q) => `<div><dt>${esc(q.label)}</dt><dd>${esc(answerText(q, s.survey[q.id]))}</dd></div>`).join("");
        return rows ? `<h3 style="margin:14px 0 8px;font-size:0.95rem;color:var(--muted)">${esc(sec.title)}</h3><dl class="answers">${rows}</dl>` : "";
      }).join("")}</section>`;
  }

  function flagsBlock(s) {
    const before = (s.flags || []).filter((f) => f.level === "before_wear");
    const notes = (s.flags || []).filter((f) => f.level !== "before_wear");
    return (before.length ? `<div class="callout stop" style="margin-bottom:16px"><p><strong>Clinician before any wear</strong></p>
        <ul style="margin:0;padding-left:1.2em">${before.map((f) => `<li>${esc(f.studio)}</li>`).join("")}</ul></div>` : "")
      + (notes.length ? `<div class="callout brand" style="margin-bottom:16px"><p><strong>Notes from the survey</strong></p>
        <ul style="margin:0;padding-left:1.2em">${notes.map((f) => `<li>${esc(f.studio)}</li>`).join("")}</ul></div>` : "");
  }

  function scanCard(s, key) {
    const scan = s.scans[key] || {};
    const files = scan.frame_files || [];
    const sum = scan.summary || {};
    const cov = sum.coverage_completeness == null ? "—" : `${Math.round(100 * sum.coverage_completeness)}%`;
    const thumbs = files.slice(0, 24).map((_, i) => {
      const src = `/api/submissions/${encodeURIComponent(s.id)}/scans/${key}/frames/${i + 1}.jpg`;
      return `<a href="${src}" target="_blank"><img src="${src}" alt="${esc(scan.label)} photo ${i + 1}" loading="lazy"></a>`;
    }).join("");
    return `<section class="card" style="margin:0 0 16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px">
        <h2 style="margin:0;font-size:1.3rem">${esc(scan.label || key)}</h2>
        <span class="badge ${scan.status === "complete" ? "ok" : "warn"}">${esc(scan.status || "missing")}</span></div>
      <dl class="facts" style="margin-top:12px">
        <div><dt>Photos</dt><dd class="mono">${files.length}</dd></div>
        <div><dt>Angles covered</dt><dd class="mono">${cov}</dd></div>
        <div><dt>Rejected</dt><dd class="mono">${(sum.rejected_blur ?? 0) + (sum.rejected_exposure ?? 0)}</dd></div>
        <div><dt>Scan time</dt><dd class="mono">${sum.duration_s ?? "—"} s</dd></div>
        <div><dt>Scale reading</dt><dd class="mono">${scan.load_kg == null ? "—" : scan.load_kg + " kg"}</dd></div>
        <div><dt>Photos with mat</dt><dd class="mono">${sum.frames_with_mat ?? "—"}${files.length && sum.frames_with_mat != null ? ` (${Math.round(100 * sum.frames_with_mat / files.length)}%)` : ""}</dd></div>
        <div><dt>Mat paper</dt><dd>${esc(sum.mat_paper || "—")}</dd></div>
        <div><dt>Focal estimate</dt><dd class="mono">${sum.focal_px_median ? Math.round(sum.focal_px_median) + " px" : "—"}</dd></div>
      </dl>
      ${files.length ? `<div class="thumbs">${thumbs}</div>` : ""}
      ${files.length > 24 ? `<p class="hint" style="margin:8px 0 0">Showing 24 of ${files.length}.</p>` : ""}
    </section>`;
  }

  function render(s) {
    const st = STATUS[s.status] || { label: s.status, cls: "" };
    const received = s.status !== "uploading";
    root.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px">
        <div><p class="eyebrow">Submission <span class="mono">${esc(s.id)}</span></p>
          <h1 style="font-size:clamp(1.8rem,4vw,2.4rem);margin:0">${esc(s.name)}</h1></div>
        <span class="badge ${st.cls}" style="font-size:0.85rem">${st.label}</span>
      </div>
      ${flagsBlock(s)}
      <div class="layout">
        <div>
          <section class="card" style="margin:0 0 16px">
            <dl class="facts">
              <div><dt>Sent</dt><dd>${fmtDate(s.submitted)}</dd></div>
              <div><dt>Feet</dt><dd>${s.feet.join(", ")}</dd></div>
              <div><dt>Use</dt><dd>${esc(s.survey?.sport || answerText(schema.flatMap((x) => x.questions).find((q) => q.id === "use"), s.survey?.use))}</dd></div>
              <div><dt>Scans</dt><dd>${Object.keys(s.scans).length}</dd></div>
              <div><dt>Mat check bar</dt><dd class="mono">${s.mat_check ? `${s.mat_check.value} ${s.mat_check.unit} (${s.mat_check.mm} mm)` : s.mat_check_mm == null ? "—" : s.mat_check_mm + " mm"}</dd></div>
            </dl>
            <h3 style="margin:16px 0 6px;font-size:0.95rem">Confirmed at ${fmtDate(s.acknowledged_at)}</h3>
            <ul class="checklist">${Object.keys(ACK_TEXT).map((k) =>
              `<li>${s.acknowledgments?.[k] ? "✓" : "✗"} ${ACK_TEXT[k]}</li>`).join("")}</ul>
          </section>
          ${Object.keys(s.scans).map((k) => scanCard(s, k)).join("")}
          ${surveyCard(s)}
        </div>

        <aside style="display:grid;gap:16px">
          <section class="card">
            <h3>Insole pipeline</h3>
            <ol class="pipeline">
              <li class="${received ? "done" : ""}"><span class="dot">${received ? "✓" : ""}</span>
                <div><strong>Scans received</strong><p>${received ? fmtDate(s.submitted) : "Waiting for the person to send."}</p></div></li>
              <li class="blocked"><span class="dot"></span>
                <div><strong>Measurement check</strong><p>Phase 0 repeatability gate. Not yet passed.</p></div></li>
              <li class="blocked"><span class="dot"></span>
                <div><strong>Build 3D foot</strong><p>Reconstruction, Phase 2. Not built yet.</p></div></li>
              <li class="blocked"><span class="dot"></span>
                <div><strong>Mark landmarks</strong><p>Phase 3. Not built yet.</p></div></li>
              <li class="blocked"><span class="dot"></span>
                <div><strong>Generate insole</strong><p>TPU print file, Phase 4. Not built yet.</p>
                  <button class="btn secondary" disabled style="margin-top:8px;min-height:36px;padding:6px 14px">Download print file</button></div></li>
              <li class="blocked"><span class="dot"></span>
                <div><strong>Clinician check</strong><p>Summary sheet for sign-off before sport.</p></div></li>
              <li class="blocked"><span class="dot"></span>
                <div><strong>Print & hand over</strong><p>With the break-in guide.</p></div></li>
            </ol>
          </section>

          <section class="card">
            <h3>Update status</h3>
            <div class="field" style="margin-bottom:10px"><label for="note">Note <span class="hint">optional</span></label>
              <textarea id="note" rows="2"></textarea></div>
            <div class="btn-row">
              <button class="btn secondary" data-status="received">Mark new</button>
              <button class="btn secondary" data-status="archived">Archive</button>
            </div>
          </section>

          <section class="card">
            <h3>Ask for new photos</h3>
            ${s.rescan ? `<div class="callout warn" style="margin-bottom:12px"><p><strong>Waiting for a rescan</strong> of
              ${s.rescan.scans.map((k) => esc(s.scans[k]?.label || k)).join(", ")} (asked ${fmtDate(s.rescan.requested_at)}).
              Making a new link replaces the old one.</p></div>` : ""}
            <p class="hint" style="margin:0 0 8px">Pick the scans to redo. The person gets a link that skips the questions
              and goes straight to those scans. The old photos are kept.</p>
            <div class="checklist" id="rescan-keys" style="margin-bottom:10px">${Object.entries(s.scans).map(([k, sc]) =>
              `<label><input type="checkbox" value="${esc(k)}"> ${esc(sc.label || k)}</label>`).join("")}</div>
            <div class="field" style="margin-bottom:10px"><label for="rescan-note">Why? <span class="hint">shown to them</span></label>
              <input id="rescan-note" type="text" maxlength="500" placeholder="e.g. the heel was blurry"></div>
            <button class="btn" id="btn-rescan" type="button">Make rescan link</button>
            <div id="rescan-out" hidden style="margin-top:12px;display:grid;gap:8px">
              <input id="rescan-link" type="text" readonly class="mono" style="font-size:0.8rem">
              <div class="btn-row">
                <button class="btn secondary" id="btn-copy-link" type="button">Copy link</button>
                <button class="btn secondary" id="btn-share-link" type="button" hidden>Share…</button>
              </div>
            </div>
          </section>

          <section class="card">
            <h3>Delete</h3>
            <p class="hint" style="margin:0 0 10px">Removes every photo and answer for this person, for good. Do this if they
              ask you to delete their data.</p>
            <button class="btn danger" id="btn-delete" type="button">Delete this submission</button>
          </section>

          <section class="card">
            <h3>History</h3>
            <ul class="history">${s.history.slice().reverse().map((h) =>
              `<li><time>${fmtDate(h.at)}</time><strong>${esc((STATUS[h.status] || {}).label || h.status)}</strong>${h.note ? ` · ${esc(h.note)}` : ""}</li>`).join("")}</ul>
          </section>
        </aside>
      </div>`;

    root.querySelectorAll("button[data-status]").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true;
      const r = await fetch(`/api/submissions/${encodeURIComponent(s.id)}/status`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status: b.dataset.status, note: document.getElementById("note").value }),
      });
      if (r.ok) render(await r.json()); else { b.disabled = false; alert((await r.json()).error); }
    }));

    document.getElementById("btn-rescan").addEventListener("click", async (e) => {
      const keys = [...document.querySelectorAll("#rescan-keys input:checked")].map((i) => i.value);
      if (!keys.length) return alert("Tick at least one scan to redo.");
      e.target.disabled = true;
      const r = await fetch(`/api/submissions/${encodeURIComponent(s.id)}/rescan`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ scans: keys, note: document.getElementById("rescan-note").value }),
      });
      const data = await r.json();
      if (!r.ok) { e.target.disabled = false; return alert(data.error); }
      // Point the link at the address phones use, not at localhost.
      const info = await fetch("/api/studio").then((x) => x.json()).catch(() => ({}));
      const base = (info.scan_url || location.origin + "/").replace(/\/$/, "");
      const link = base + data.path;
      await load();
      document.getElementById("rescan-out").hidden = false;
      document.getElementById("rescan-link").value = link;
      document.getElementById("btn-copy-link").onclick = async () => {
        try { await navigator.clipboard.writeText(link); } catch { document.getElementById("rescan-link").select(); }
        document.getElementById("btn-copy-link").textContent = "Copied";
      };
      const share = document.getElementById("btn-share-link");
      share.hidden = !navigator.share;
      share.onclick = () => navigator.share({ title: "Please scan again", text: "We need a few new photos for your insole.", url: link }).catch(() => {});
    });

    document.getElementById("btn-delete").addEventListener("click", async () => {
      if (!confirm(`Delete everything for ${s.name}? This can't be undone.`)) return;
      const r = await fetch(`/api/submissions/${encodeURIComponent(s.id)}`, { method: "DELETE" });
      if (r.ok) location.href = "/studio/"; else alert((await r.json()).error);
    });
  }
  load();
</script>
</body>
</html>
