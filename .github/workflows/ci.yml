name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch — no point checking an old commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, accessibility, links, budget
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check content collections and pages
        run: npm run check

      - name: Build
        run: npm run build

      # A production build must never contain a placeholder slot. This is a
      # second lock on top of the import.meta.env.DEV gate in src/lib/visibility.ts —
      # if that gate ever regresses, this fails the build loudly rather than
      # shipping fabricated project entries to a live site.
      - name: Assert no placeholder content reached the build
        run: |
          if grep -rl 'placeholder-flag\|Layout slot, not a project' dist --include='*.html' | grep -q .; then
            echo "::error::A placeholder slot reached the production build."
            grep -rl 'placeholder-flag\|Layout slot, not a project' dist --include='*.html'
            exit 1
          fi
          echo "No placeholder content in dist/."

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe-core, every page, both themes, 3 viewports)
        run: npm run test:a11y

      - name: Links resolve
        run: npm run test:links

      - name: Performance budget
        run: npm run test:budget

      - name: Upload built site
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  lighthouse:
    name: Lighthouse (a11y and performance >= 95)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: verify

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      # Build in launch mode: the default build is fail-closed noindex, which
      # Lighthouse correctly scores as "blocked from search". Measure what will
      # actually go live.
      - run: npm run build
        env:
          PUBLIC_ALLOW_INDEXING: 'true'

      - name: Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
